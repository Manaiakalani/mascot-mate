<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mascot Mate — demo</title>
    <style>
      body { font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
      h1 { font-size: 22px; }
      .controls { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
      button { padding: 6px 12px; border: 1px solid #888; border-radius: 4px; background: #f4f4f4; cursor: pointer; }
      button:hover { background: #eaeaea; }
      code { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; }
      .status { padding: 8px 12px; border-radius: 4px; background: #fff8d8; border: 1px solid #d8c870; font-size: 12px; }
      .note { font-size: 12px; color: #555; margin-top: 24px; }
    </style>
  </head>
  <body>
    <h1>Mascot Mate — GitHub Pages demo</h1>
    <p>Drag the mascot, switch characters, and play the greeting. This page is the sprite demo.</p>
    <div class="controls">
      <button id="clippy">Switch to Clippy</button>
      <button id="ninjacat">Switch to Ninja Cat</button>
      <button id="bob">Switch to Bob</button>
      <button id="hide">Hide</button>
      <button id="show">Show</button>
      <button id="wave">Play Greeting</button>
    </div>
    <div class="status" id="status">Booting widget…</div>
    <p class="note">
      Asking a question here explains that no chat proxy is deployed.
      Run the server from the
      <a href="https://github.com/Manaiakalani/mascot-mate">repository README</a>
      and point a local copy of the widget at it.
    </p>

    <script type="module">
      import { init } from './mascot.js';
      const status = document.getElementById('status');
      try {
        const m = await init({
          // Sprite demo only. A blank endpoint tells the widget not to call a proxy.
          endpoint: '',
          mascot: 'clippy',
        });
        window.Mascot = m;
        status.textContent = `Loaded mascots: ${m.available().join(', ')}. Current: ${m.current()}.`;
        document.getElementById('clippy').onclick = () => m.switchTo('clippy');
        document.getElementById('ninjacat').onclick = () =>
          m.switchTo('ninjacat').catch((e) => alert(e.message));
        document.getElementById('bob').onclick = () =>
          m.switchTo('bob').catch((e) => alert(e.message));
        document.getElementById('hide').onclick = () => m.hide();
        document.getElementById('show').onclick = () => m.show();
        document.getElementById('wave').onclick = () => m.show();
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        console.error(e);
      }
    </script>
  </body>
</html>
